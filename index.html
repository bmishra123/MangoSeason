<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seat Booking App</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <h1>Mango Festival Seat Booking</h1>
  <div id="seats-container"></div>

  <form id="bookingForm">
    <h2>Guest Details</h2>
    <input type="text" id="guestName" placeholder="Guest Name" required />
    <input type="text" id="guestPhone" placeholder="Phone Number" required />
    <input type="email" id="guestEmail" placeholder="Email" required />
    <input type="submit" value="Book Selected Seats" />
  </form>

  <script src="script.js"></script>
</body>
</html>
